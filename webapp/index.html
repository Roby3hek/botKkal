<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>КБЖУ — дневник питания</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <header id="topbar" class="topbar"></header>
    <main id="view" class="view" aria-live="polite"></main>
    <nav id="tabbar" class="tabbar" aria-label="Разделы"></nav>
  </div>

  <div id="sheet" class="sheet hidden" aria-hidden="true">
    <div class="sheet-backdrop" data-act="close"></div>
    <section class="sheet-panel" id="sheetPanel" role="dialog" aria-modal="true"></section>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>
  <div id="fatal" class="fatal hidden"></div>

  <script src="app.js"></script>
</body>
</html>
